<title>Project Halo</title>
<meta name="description" content="Project Halo — a character-creator style engagement ring customizer with a live 3D ring and an optional price estimate, built to hand a spec to a jeweler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#ECEAE5; --panel:#F6F5F1; --panel2:#FFFFFF; --ink:#1C1A20; --ink2:#5E5B66; --muted:#8B8792;
    --line:#D8D4CC; --line2:#E7E4DD; --gold:#A8842F; --gold2:#C9A651; --gold-ink:#3E3110;
    --stage:#E3E0DA; --stage2:#CDC9C1; --good:#2F7D4F; --warn:#B4651C; --warn-bg:rgba(180,101,28,.10);
    --shadow:0 12px 32px rgba(20,18,26,.14); --sel-bg:rgba(168,132,47,.10); --focus:#2F5FD3;
    --display:'Fraunces',Georgia,'Times New Roman',serif;
    --ui:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141319; --panel:#1B1A21; --panel2:#23222A; --ink:#EEEBE4; --ink2:#B7B3BE; --muted:#807C89;
      --line:#2A2933; --line2:#33323D; --gold:#D6B35A; --gold2:#EAC974; --gold-ink:#F6E9C6;
      --stage:#1B1A21; --stage2:#0E0D12; --good:#7BC89A; --warn:#E0A05B; --warn-bg:rgba(224,160,91,.12);
      --shadow:0 12px 32px rgba(0,0,0,.5); --sel-bg:rgba(214,179,90,.13); --focus:#8FB0FF;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141319; --panel:#1B1A21; --panel2:#23222A; --ink:#EEEBE4; --ink2:#B7B3BE; --muted:#807C89;
    --line:#2A2933; --line2:#33323D; --gold:#D6B35A; --gold2:#EAC974; --gold-ink:#F6E9C6;
    --stage:#1B1A21; --stage2:#0E0D12; --good:#7BC89A; --warn:#E0A05B; --warn-bg:rgba(224,160,91,.12);
    --shadow:0 12px 32px rgba(0,0,0,.5); --sel-bg:rgba(214,179,90,.13); --focus:#8FB0FF;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  #app{height:100%;display:grid;grid-template-columns:292px 336px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);background:var(--bg)}

  /* ---------- header ---------- */
  #top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
  .brand h1 em{font-style:italic;color:var(--gold)}
  .brand .tag{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  #top .grow{flex:1}
  .btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:500;white-space:nowrap}
  .btn:hover{border-color:var(--gold2)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn.primary:hover{background:var(--gold2);border-color:var(--gold2)}
  .btn.ghost{background:transparent}
  .btn svg{width:16px;height:16px}

  /* ---------- slot rail ---------- */
  #slots{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  #slots .rail-head{padding:14px 16px 8px}
  .looks{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:thin}
  .look{flex:0 0 auto;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:500;color:var(--ink2)}
  .look:hover{border-color:var(--gold2);color:var(--ink)}
  .slot-list{flex:1;overflow-y:auto;min-height:0;border-top:1px solid var(--line)}
  .slot{display:grid;grid-template-columns:44px minmax(0,1fr) 16px;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line2);border-left:3px solid transparent;position:relative}
  .slot:hover{background:var(--sel-bg)}
  .slot[aria-current="true"]{border-left-color:var(--gold);background:var(--sel-bg)}
  .slot .ico{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
  .slot .ico svg{width:30px;height:30px}
  .slot .lab{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .slot .val{display:block;font-family:var(--display);font-size:16px;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .chev{color:var(--muted)}
  .slot .delta{position:absolute;right:30px;top:10px;font-size:11px;color:var(--muted)}
  .rail-foot{padding:10px 12px;display:flex;gap:8px;border-top:1px solid var(--line)}
  .rail-foot .btn{flex:1;justify-content:center;height:32px;font-size:13px}

  /* ---------- option tray ---------- */
  #tray{border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
  .tray-head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .tray-head h2{font-family:var(--display);font-size:22px}
  .tray-head p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:34ch}
  .tray-body{flex:1;overflow-y:auto;min-height:0;padding:14px 18px 24px;display:flex;flex-direction:column;gap:18px}
  .group{display:flex;flex-direction:column;gap:8px}
  .group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .group-head .eyebrow{color:var(--ink2)}
  .group-head .hint{font-size:12px;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);min-width:0;position:relative}
  .tile:hover{border-color:var(--gold2);color:var(--ink)}
  .tile[aria-pressed="true"]{border-color:var(--gold);background:var(--sel-bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
  .tile[disabled]{opacity:.4;cursor:not-allowed}
  .tile svg{width:38px;height:38px;flex:none}
  .tile .sw{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.15);box-shadow:inset -6px -8px 14px rgba(0,0,0,.18),inset 6px 8px 12px rgba(255,255,255,.35)}
  .tile .t{font-size:12px;font-weight:500;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tile .d{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1}
  .tile .d.up{color:var(--warn)} .tile .d.down{color:var(--good)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:500;color:var(--ink2)}
  .chip:hover{border-color:var(--gold2);color:var(--ink)}
  .chip[aria-pressed="true"]{border-color:var(--gold);background:var(--sel-bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
  .range{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
  .range label{font-size:13px;color:var(--ink2)}
  .range .ro{font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .range input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold);margin:2px 0 0}
  .range .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
  .field input[type=text]{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 10px;font:inherit}
  .switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
  .switchrow .l{font-size:13px;font-weight:500}
  .switchrow .s{font-size:12px;color:var(--muted)}
  .note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:12.5px;line-height:1.35}
  .note svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:1px}
  .note.ok{background:var(--sel-bg)} .note.ok svg{color:var(--gold)}

  /* switch */
  .switch{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--gold)}
  .switch[aria-checked="true"]::after{transform:translateX(16px)}

  /* ---------- stage ---------- */
  #stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 40%,var(--stage) 0%,var(--stage2) 100%)}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .stage-ui{position:absolute;inset:0;pointer-events:none}
  .stage-ui>*{pointer-events:auto}
  .views{position:absolute;left:16px;top:14px;display:flex;gap:6px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:4px}
  .views button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)}
  .views button[aria-pressed="true"]{background:var(--sel-bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
  .estimator{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:min(330px,calc(100% - 32px))}
  .est-toggle{display:flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 12px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);font-weight:500;font-size:13px}
  .est-card{width:330px;max-width:100%;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow);padding:14px 16px 12px}
  .est-card .eyebrow{display:flex;justify-content:space-between;align-items:center}
  .est-card .big{font-family:var(--display);font-size:30px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .est-card .big small{font-size:14px;color:var(--muted);font-family:var(--ui);margin-left:6px}
  .est-card .mid{font-size:12px;color:var(--muted);margin-bottom:10px}
  .lines{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
  .lines .k{color:var(--ink2)} .lines .k small{display:block;color:var(--muted);font-size:11px}
  .lines .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .lines .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:600}
  .est-card details{margin-top:10px;font-size:12px;color:var(--muted)}
  .est-card summary{cursor:pointer;color:var(--ink2)}
  .est-card details p{margin:6px 0 0;line-height:1.4}
  .est-card .link{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
  .strip{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .strip .summary{flex:1 1 260px;min-width:0;font-family:var(--display);font-size:15px;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strip .summary .num{font-size:12px;color:var(--muted);margin-left:8px}
  .strip .btn{height:36px}
  .stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink2);font-size:14px}
  .stage-msg b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:6px}
  .hint-rot{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

  /* ---------- drawer (spec / jeweler) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,9,14,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .drawer-head h2{font-family:var(--display);font-size:22px;flex:1}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px}
  .spec{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
  .spec .k{color:var(--muted)} .spec .v{color:var(--ink)}
  .spec .sec{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  textarea.json{width:100%;height:190px;font-family:var(--mono);font-size:11.5px;line-height:1.35;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px;resize:vertical}
  .jeweler{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
  .jeweler .av{width:44px;height:44px;border-radius:12px;background:var(--sel-bg);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--gold)}
  .jeweler .n{font-weight:600} .jeweler .m{font-size:12px;color:var(--muted)}
  .jeweler .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .jeweler .tags span{font-size:10.5px;padding:2px 6px;border-radius:999px;background:var(--sel-bg);color:var(--gold-ink)}
  .sample{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- responsive ---------- */
  @media (max-width:1100px){
    #app{grid-template-columns:250px 300px minmax(0,1fr)}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:820px){
    body{overflow:auto}
    #app{height:auto;min-height:100%;display:flex;flex-direction:column}
    #top{height:54px;padding:0 16px}
    #top .btn .lbl{display:none}
    #stage{order:1;height:46vh;min-height:300px;flex:none}
    #slots{order:2;border-right:0;border-top:1px solid var(--line)}
    #slots .rail-head,.rail-foot{display:none}
    .looks{display:none}
    .slot-list{display:flex;overflow-x:auto;overflow-y:hidden;border-top:0;scrollbar-width:thin}
    .slot{flex:0 0 auto;width:150px;grid-template-columns:36px minmax(0,1fr);border-bottom:0;border-left:0;border-right:1px solid var(--line2);border-top:3px solid transparent;padding:8px 10px}
    .slot[aria-current="true"]{border-top-color:var(--gold)}
    .slot .ico{width:36px;height:36px} .slot .ico svg{width:24px;height:24px}
    .slot .chev,.slot .delta{display:none}
    .slot .val{font-size:14px}
    #tray{order:3;border-right:0;border-top:1px solid var(--line);flex:1}
    .tray-body{padding:14px 16px 28px}
    .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
    .estimator{right:12px;top:10px}
    .est-card{width:280px}
    .views{left:12px;top:10px}
    .hint-rot{display:none}
    .strip{left:12px;right:12px;bottom:10px}
    .strip .summary{font-size:13px}
  }
  @media (prefers-reduced-motion: reduce){
    .drawer,.scrim,.toast,.switch,.switch::after{transition:none}
  }
</style>
<div id="app">
  <header id="top">
    <div class="brand">
      <h1>Project <em>Halo</em></h1>
      <span class="tag">Ring builder · demo</span>
    </div>
    <div class="grow"></div>
    <button class="btn ghost" id="btn-random" title="Surprise me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span class="lbl">Surprise me</span>
    </button>
    <button class="btn primary" id="btn-spec">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      <span class="lbl">Send to a jeweler</span>
    </button>
  </header>

  <aside id="slots" aria-label="Ring parts">
    <div class="rail-head">
      <div class="eyebrow">Start from a look</div>
    </div>
    <div class="looks" id="looks"></div>
    <div class="slot-list" id="slot-list" role="tablist" aria-orientation="vertical"></div>
    <div class="rail-foot">
      <button class="btn" id="btn-reset">Reset</button>
      <button class="btn" id="btn-theme" title="Toggle light / dark">Theme</button>
    </div>
  </aside>

  <section id="tray" aria-live="polite">
    <div class="tray-head">
      <h2 id="tray-title">Center stone</h2>
      <p id="tray-desc"></p>
    </div>
    <div class="tray-body" id="tray-body"></div>
  </section>

  <main id="stage">
    <canvas id="gl" aria-label="3D ring preview"></canvas>
    <div class="stage-ui">
      <div class="views" id="views" role="group" aria-label="Camera views">
        <button data-view="hero" aria-pressed="true">¾ view</button>
        <button data-view="top" aria-pressed="false">Top</button>
        <button data-view="side" aria-pressed="false">Profile</button>
        <button data-view="front" aria-pressed="false">Front</button>
      </div>
      <div class="hint-rot" id="hint-rot">drag to turn · scroll to zoom</div>
      <div class="estimator">
        <button class="est-toggle" id="est-toggle" aria-pressed="false">
          <span>Price estimate</span>
          <span class="switch" id="est-switch" aria-checked="false" role="switch"></span>
        </button>
        <div class="est-card" id="est-card" hidden></div>
      </div>
      <div class="strip">
        <div class="summary" id="summary"></div>
        <button class="btn" id="btn-copy-summary" title="Copy a one-line summary">Copy summary</button>
      </div>
      <div class="stage-msg" id="stage-msg" hidden></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Spec sheet" aria-hidden="true">
  <div class="drawer-head">
    <h2>Send to a jeweler</h2>
    <button class="btn" id="drawer-close">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status"></div>
<script type="module">
// =====================================================================
//  PROJECT HALO — demo ring builder
//  Section 1: option catalogue, presets, sizing math, price model

// ---------- sizing math ----------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const deepMerge = (base, patch) => { const o = structuredClone(base); for (const k in patch) { if (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k])) o[k] = deepMerge(o[k] || {}, patch[k]); else o[k] = patch[k]; } return o; };

// mm dimensions of the center stone from carat + ratio: L, W, D
function stoneDims(st) {
  const sh = SHAPE[st.shape];
  const ratio = sh.ratio[0] === sh.ratio[1] ? 1 : clamp(st.ratio, sh.ratio[0], sh.ratio[1]);
  let depth = sh.depth, k = sh.k;
  if (st.cutStyle === 'oldeuro') { depth *= 1.1; }
  if (st.cutStyle === 'rose') { depth *= .45; k *= 1.05; }
  // ct = L*W*D*k = ratio*W * W * depth*W * k
  const W = Math.cbrt(st.carat / (ratio * depth * k));
  return { L: W * ratio, W, D: W * depth, ratio };
}
// US ring size -> inner diameter (mm)
const ringID = size => 11.63 + 0.8128 * size;
const sizeUK = size => { const uk = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; const i = Math.round((size - 1.5) * 2); return uk[Math.floor(i / 2)] + (i % 2 ? '½' : ''); };
const sizeEU = size => Math.round(ringID(size) * Math.PI);

// melee (small accent stone) diameter, scaled to the center stone
const meleeFor = W => clamp(.19 * W, 1.0, 1.9);

  if (currentSlot === 'size') {
    add('Carat weight', range({ id: 'carat', label: 'Carat', min: .25, max: 6, step: .01, value: st.carat, fmt: v => `${v.toFixed(2)} ct`, sub: v => { const d = stoneDims({ ...st, carat: v }); return `≈ ${d.L.toFixed(1)} × ${d.W.toFixed(1)} mm face, ${d.D.toFixed(1)} mm deep`; }, set: v => { st.carat = v; } }), 'Drag; the 3D stone resizes');
    if (st.type === 'natural' || st.type === 'lab') {
      add('Colour', chips(COLORS.map(c => ({ id: c, label: c })), it => it.id === st.color, it => { st.color = it.id; }, { apply: (s, it) => { s.stone.color = it.id; } }), 'D is colourless; G–H look white to the eye');
      add('Clarity', chips(CLARITY.map(c => ({ id: c, label: c })), it => it.id === st.clarity, it => { st.clarity = it.id; }, { apply: (s, it) => { s.stone.clarity = it.id; } }), 'VS1–VS2 is the value sweet spot');
      add('Cut grade', chips(CUTS, it => it.id === st.cut, it => { st.cut = it.id; }, { apply: (s, it) => { s.stone.cut = it.id; } }));
    }
  }
  if (currentSlot === 'head') {
    add('Head', tiles(HEADS, it => it.id === state.head.style, it => { state.head.style = it.id; }, { icon: it => glyph(it.id), apply: (s, it) => { s.head.style = it.id; } }));
    if (!['bezel', 'halfbezel', 'tension'].includes(state.head.style)) add('Prong tips', tiles(PRONG_TIPS, it => it.id === state.head.tip, it => { state.head.tip = it.id; }, { icon: it => glyph(it.id === 'flat' ? 'flat_tip' : it.id) }));
    add('Profile', tiles(PROFILES, it => it.id === state.head.profile, it => { state.head.profile = it.id; }, { icon: it => glyph(it.id), apply: (s, it) => { s.head.profile = it.id; }, cols: 2 }));
  }
  if (currentSlot === 'halo') {
    add('Halo', tiles(HALOS, it => it.id === state.halo.style, it => { state.halo.style = it.id; }, { icon: it => glyph(it.id === 'double' ? 'halo_double' : it.id), apply: (s, it) => { s.halo.style = it.id; } }));
    if (state.halo.style === 'single' || state.halo.style === 'double' || state.halo.style === 'both') add('Halo outline', tiles(HALO_SHAPES, it => it.id === state.halo.shape, it => { state.halo.shape = it.id; }, { icon: it => glyph(it.id === 'round' ? 'round_halo' : it.id) }));
    if (state.halo.style !== 'none') add('Halo stones', tiles(ACCENTS, it => it.id === state.halo.accent, it => { state.halo.accent = it.id; }, { icon: it => swatch(it.hex, true), apply: (s, it) => { s.halo.accent = it.id; } }));
  }
  if (currentSlot === 'sides') {
    add('Style', tiles(SIDES, it => it.id === state.sides.style, it => { state.sides.style = it.id; }, { icon: it => glyph(it.id === 'none' ? 'sides_none' : it.id), apply: (s, it) => { s.sides.style = it.id; }, cols: 2 }));
    if (state.sides.style === 'pave' || state.sides.style === 'channel') add('Coverage', tiles(COVERAGES, it => it.id === state.sides.coverage, it => { state.sides.coverage = it.id; }, { icon: it => glyph(it.id), apply: (s, it) => { s.sides.coverage = it.id; } }));
    if (state.sides.style === 'three') {
      add('Side stone shape', tiles(SIDE_SHAPES, it => it.id === state.sides.sideShape, it => { state.sides.sideShape = it.id; }, { icon: it => shapeSVG(it.id, SIDE_META[it.id].ratio) }));
      add('Side stone size', range({ id: 'sideSize', label: 'Relative to center', min: .25, max: .55, step: .01, value: state.sides.sideSize, fmt: v => `${Math.round(v * 100)}%`, set: v => { state.sides.sideSize = v; } }));
    }
    if (state.sides.style !== 'none') add('Accent stones', tiles(ACCENTS, it => it.id === state.sides.accent, it => { state.sides.accent = it.id; }, { icon: it => swatch(it.hex, true), apply: (s, it) => { s.sides.accent = it.id; } }));
  }
  if (currentSlot === 'band') {
    add('Style', tiles(BANDS, it => it.id === state.band.style, it => { state.band.style = it.id; }, { icon: it => glyph(it.id), apply: (s, it) => { s.band.style = it.id; } }));
    add('Cross-section', tiles(BAND_PROFILES, it => it.id === state.band.profile, it => { state.band.profile = it.id; }, { icon: it => glyph(it.id), apply: (s, it) => { s.band.profile = it.id; }, cols: 2 }));
    add('Width', range({ id: 'width', label: 'Band width', min: 1.4, max: 4, step: .1, value: state.band.width, fmt: v => `${v.toFixed(1)} mm`, sub: v => v < 1.7 ? 'Dainty. Makes the stone look bigger, wears faster.' : v < 2.3 ? 'The everyday standard.' : v < 3 ? 'Substantial, modern.' : 'Cigar band territory.', set: v => { state.band.width = v; } }));
  }
  if (currentSlot === 'metal') {
    add('Metal', tiles(METALS, it => it.id === state.metal.id, it => { state.metal.id = it.id; }, { icon: it => swatch(it.hex), apply: (s, it) => { s.metal.id = it.id; } }));
    add('Head metal', chips(HEAD_METALS, it => it.id === state.metal.head, it => { state.metal.head = it.id; }, { apply: (s, it) => { s.metal.head = it.id; } }), 'White heads make white stones read whiter');
    add('Finish', tiles(FINISHES, it => it.id === state.metal.finish, it => { state.metal.finish = it.id; }, { icon: it => glyph(it.id), apply: (s, it) => { s.metal.finish = it.id; } }));
  }
  if (currentSlot === 'details') {
    body.appendChild(switchRow('Milgrain edges', 'Tiny beaded border along the band. Vintage feel.', state.details.milgrain, v => { state.details.milgrain = v; }));
    add('Hidden gem', tiles(HIDDEN_GEMS, it => it.id === state.details.hidden, it => { state.details.hidden = it.id; }, { icon: it => it.hex ? swatch(it.hex, true) : glyph('none'), apply: (s, it) => { s.details.hidden = it.id; } }), 'A secret stone under the head');
    const f = el('div', 'field group'); f.innerHTML = `<div class="group-head"><span class="eyebrow">Engraving</span><span class="hint">Inside the band</span></div><input type="text" id="engraving" maxlength="40" placeholder="e.g. 14.02.27 · always" value="${esc(state.details.engraving)}">`;
    f.querySelector('input').addEventListener('input', e => { state.details.engraving = e.target.value; update({ keepTray: true }); });
    body.appendChild(f);
    if (state.details.engraving) body.appendChild(switchRow('Hand engraved', 'By an engraver, not a machine. Slower, more character.', state.details.hand, v => { state.details.hand = v; }));
  }
  if (currentSlot === 'fit') {
    add('US size', range({ id: 'size', label: 'Finger size', min: 3, max: 13, step: .25, value: state.fit.size, fmt: v => `US ${v}`, sub: v => `Inner diameter ${ringID(v).toFixed(1)} mm · UK ${sizeUK(v)} · EU ${sizeEU(v)} · Most common: 6 (women), 10 (men)`, set: v => { state.fit.size = v; } }));
    const info = el('div', 'note ok'); info.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>Not sure? Jewelers can size a plain or half-pavé band up or down about two sizes later. Eternity and tension rings cannot be resized.</span>`; body.appendChild(info);
  }
  body.scrollTop = keepTop;
}

// ---------- summary / estimator ----------
function summaryText(s) {
  const st = s.stone, d = stoneDims(st), g = GEM[st.type];
  const parts = [`${st.carat.toFixed(2)} ct ${SHAPE[st.shape].label.toLowerCase()} ${g.label.toLowerCase()}${st.type !== 'natural' && st.type !== 'lab' && st.origin === 'lab' ? ' (lab)' : ''}`];
  parts.push(HEADS.find(h => h.id === s.head.style).label.toLowerCase() + (s.head.profile !== 'standard' ? ` ${PROFILES.find(p => p.id === s.head.profile).label.toLowerCase()}` : ''));
  if (s.halo.style !== 'none') parts.push(HALOS.find(h => h.id === s.halo.style).label.toLowerCase());
  if (s.sides.style !== 'none') parts.push(SLOTS.find(x => x.id === 'sides').value(s).toLowerCase());
  parts.push(`${BANDS.find(b => b.id === s.band.style).label.toLowerCase()} ${s.band.width.toFixed(1)} mm band`);
  parts.push(METAL[s.metal.id].label);
  return { text: parts.join(' · '), mm: `${d.L.toFixed(1)}×${d.W.toFixed(1)} mm · US ${s.fit.size}` };
}
function updateSummary() { const s = summaryText(state); $('#summary').innerHTML = `${esc(s.text)}<span class="num">${esc(s.mm)}</span>`; }
function updateEstimate() {
  const card = $('#est-card'); $('#est-toggle').setAttribute('aria-pressed', estimatorOn); $('#est-switch').setAttribute('aria-checked', estimatorOn);
  card.hidden = !estimatorOn; if (!estimatorOn) return;
  const e = estimate(state);
  card.innerHTML = `<div class="eyebrow"><span>Estimated jeweler quote</span><span class="sample">demo model</span></div>
    <div class="big">${fmt$(e.low)}<small>to ${fmt$(e.high)}</small></div>
    <div class="mid">Midpoint ${fmt$(e.total)}. Materials at today’s metal prices plus typical custom labor; the spread is how much jewelers differ.</div>
    <div class="lines">${e.lines.map(l => `<span class="k">${esc(l.k)}<small>${esc(l.sub)}</small></span><span class="v">${fmt$(l.v)}</span>`).join('')}<span class="k tot">Estimate</span><span class="v tot">${fmt$(e.total)}</span></div>
    <details><summary>How this is estimated</summary><p>Center stone from per-carat curves (natural: StoneAlgo Sept 2026 with the Rapaport colour × clarity grid; lab: StoneAlgo; gems: 2026 trade tiers). Metal from the band’s real volume × alloy density × Kitco spot, with casting loss and a retail multiplier. Labor from typical custom-shop line items. Option chips show the price change before you commit. Every constant lives in one table in the source and can be swapped for your own data.</p></details>`;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }

// ---------- spec sheet / jeweler drawer ----------
function specRows(s) {
  const st = s.stone, d = stoneDims(st), g = GEM[st.type], c = stoneCounts(s, d), md = meleeFor(d.W);
  const rows = [['sec', 'Center stone'],
    ['Stone', g.label + (g.origins.length > 1 && st.type !== 'natural' && st.type !== 'lab' ? ` (${st.origin === 'lab' ? 'lab-created' : 'natural'})` : '') + (!(st.type === 'natural' || st.type === 'lab' || st.type === 'moissanite') && st.origin === 'natural' ? `, ${TIERS.find(t => t.id === (st.tier || 'fine')).label.toLowerCase()} quality` : '')],
    ['Shape', `${SHAPE[st.shape].label}, ${CUT_STYLES.find(c => c.id === st.cutStyle).label.toLowerCase()}`],
    ['Size', `${st.carat.toFixed(2)} ct ≈ ${d.L.toFixed(2)} × ${d.W.toFixed(2)} × ${d.D.toFixed(2)} mm (L:W ${d.ratio.toFixed(2)})`],
    ['Orientation', st.orient === 'ew' && SHAPE[st.shape].elong ? 'East–west' : 'North–south']];
  if (st.type === 'natural' || st.type === 'lab') rows.push(['Grade', `${st.color} colour, ${st.clarity} clarity, ${CUTS.find(x => x.id === st.cut).label.toLowerCase()} cut`]);
  rows.push(['sec', 'Setting'], ['Head', `${HEADS.find(h => h.id === s.head.style).label}${['bezel', 'halfbezel', 'tension'].includes(s.head.style) ? '' : `, ${PRONG_TIPS.find(t => t.id === s.head.tip).label.toLowerCase()} tips`}${SHAPE[st.shape].tips || st.shape === 'princess' ? ', V-prongs on points' : ''}`], ['Profile', PROFILES.find(p => p.id === s.head.profile).label]);
  rows.push(['Halo', s.halo.style === 'none' ? 'None' : `${HALOS.find(h => h.id === s.halo.style).label}, ${c.halo} × ~${md.toFixed(1)} mm ${ACCENTS.find(a => a.id === s.halo.accent).label.toLowerCase()}${s.halo.style !== 'hidden' ? `, ${HALO_SHAPES.find(h => h.id === s.halo.shape).label.toLowerCase()} outline` : ''}`]);
  rows.push(['Side stones', s.sides.style === 'none' ? 'None' : s.sides.style === 'three' ? `Three-stone, 2 × ${SIDE_SHAPES.find(x => x.id === s.sides.sideShape).label.toLowerCase()} at ${Math.round(s.sides.sideSize * 100)}% of center width, ${ACCENTS.find(a => a.id === s.sides.accent).label.toLowerCase()}` : `${SIDES.find(x => x.id === s.sides.style).label}, ${COVERAGES.find(x => x.id === s.sides.coverage).label.toLowerCase()} coverage, ${c.band} × ~${Math.min(md, s.band.width - .55).toFixed(1)} mm ${ACCENTS.find(a => a.id === s.sides.accent).label.toLowerCase()}`]);
  rows.push(['sec', 'Band & metal'], ['Band', `${BANDS.find(b => b.id === s.band.style).label}, ${BAND_PROFILES.find(p => p.id === s.band.profile).label.toLowerCase()}, ${s.band.width.toFixed(1)} mm wide`], ['Metal', METAL[s.metal.id].label + (s.metal.head !== 'same' ? `, ${METAL[s.metal.head].label} head` : '')], ['Finish', FINISHES.find(f => f.id === s.metal.finish).label], ['Ring size', `US ${s.fit.size} (UK ${sizeUK(s.fit.size)}, EU ${sizeEU(s.fit.size)}, ${ringID(s.fit.size).toFixed(1)} mm inner diameter)`]);
  const det = []; if (s.details.milgrain) det.push('Milgrain edges'); if (s.details.hidden !== 'none') det.push(`Hidden ${HIDDEN_GEMS.find(h => h.id === s.details.hidden).label.toLowerCase()} under the head`); if (s.details.engraving) det.push(`${s.details.hand ? 'Hand' : 'Machine'} engraving: “${s.details.engraving}”`);
  rows.push(['sec', 'Details'], ['Extras', det.length ? det.join('; ') : 'None']);
  return rows;
}
function specJSON(s) { const d = stoneDims(s.stone), c = stoneCounts(s, d); return JSON.stringify({ project: 'halo-demo', version: 1, design: s, derived: { stone_mm: { L: +d.L.toFixed(2), W: +d.W.toFixed(2), D: +d.D.toFixed(2) }, inner_diameter_mm: +ringID(s.fit.size).toFixed(2), accent_counts: c, estimate_usd: estimatorOn ? Math.round(estimate(s).total) : undefined } }, null, 2); }
const SAMPLE_JEWELERS = [
  { n: 'Atelier Marrow', m: 'Brooklyn, NY · 4.9 ★ · 212 custom rings', t: ['Hand-set pavé', 'Platinum', 'Antique cuts'] },
  { n: 'Ferro & Daughters', m: 'Chicago, IL · 4.8 ★ · 98 custom rings', t: ['Bezels', 'Colored stones', 'CAD in 5 days'] },
  { n: 'Northlight Goldsmiths', m: 'Portland, OR · 5.0 ★ · 61 custom rings', t: ['Recycled gold', 'Hidden halos', 'Engraving'] },
];
function openDrawer() {
  const body = $('#drawer-body'); body.innerHTML = '';
  const s = summaryText(state);
  body.appendChild(el('div', null, `<div class="eyebrow">Your design</div><p style="margin:6px 0 0;font-family:var(--display);font-size:18px;line-height:1.3">${esc(s.text)}</p>`));
  const grid = el('div', 'spec'); grid.innerHTML = specRows(state).map(([k, v]) => k === 'sec' ? `<div class="sec eyebrow">${esc(v)}</div>` : `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join(''); body.appendChild(grid);
  const acts = el('div', null); acts.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
  const copySpec = el('button', 'btn primary', 'Copy spec sheet'); copySpec.addEventListener('click', () => copyText(specRows(state).map(([k, v]) => k === 'sec' ? `\n${v.toUpperCase()}` : `${k}: ${v}`).join('\n').trim(), 'Spec sheet copied'));
  const copyJson = el('button', 'btn', 'Copy JSON'); copyJson.addEventListener('click', () => copyText(specJSON(state), 'JSON copied'));
  acts.append(copySpec, copyJson); body.appendChild(acts);
  const ta = el('textarea', 'json'); ta.readOnly = true; ta.value = specJSON(state); ta.setAttribute('aria-label', 'Design JSON'); body.appendChild(group('Machine-readable spec', ta, 'What a jeweler’s CAD desk would receive'));
  const jw = el('div', null); jw.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  for (const j of SAMPLE_JEWELERS) { const c = el('div', 'jeweler'); c.innerHTML = `<div class="av">${esc(j.n[0])}</div><div><div class="n">${esc(j.n)}</div><div class="m">${esc(j.m)}</div><div class="tags">${j.t.map(t => `<span>${esc(t)}</span>`).join('')}</div></div><button class="btn">Request quote</button>`; c.querySelector('button').addEventListener('click', () => toast('Demo only: this would send your spec to the jeweler.')); jw.appendChild(c); }
  const head = el('div', 'group-head'); head.innerHTML = `<span class="eyebrow">Matched jewelers</span><span class="sample">sample data</span>`;
  const wrap = el('div', 'group'); wrap.append(head, jw); body.appendChild(wrap);
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open');
}
function closeDrawer() { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open'); }
async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch (e) { toast('Copy blocked here; select the text and copy manually.'); } }

// ---------- randomize ----------
const pick = a => a[Math.floor(Math.random() * a.length)];
function randomize() {
  const s = structuredClone(DEFAULT);
  const g = pick(GEMS.filter(x => !x.fragile || Math.random() < .3)); s.stone.type = g.id; s.stone.origin = pick(g.origins);
  const sh = pick(SHAPES); s.stone.shape = sh.id; s.stone.ratio = +lerp(sh.ratio[0], sh.ratio[1], Math.random()).toFixed(2);
  s.stone.carat = +pick([.75, 1, 1.25, 1.5, 1.8, 2, 2.5, 3]).toFixed(2); s.stone.orient = sh.elong && Math.random() < .2 ? 'ew' : 'ns';
  s.stone.cutStyle = (sh.id === 'round' || sh.id === 'cushion') && Math.random() < .2 ? pick(['oldeuro', 'rose']) : 'brilliant';
  s.head.style = g.fragile ? pick(['bezel', 'halfbezel']) : pick(HEADS.filter(h => h.id !== 'tension' || g.hard >= 9)).id; s.head.tip = pick(PRONG_TIPS).id; s.head.profile = pick(PROFILES).id;
  s.halo.style = pick(['none', 'none', 'single', 'hidden', 'double', 'both']); s.halo.shape = pick(HALO_SHAPES).id; s.halo.accent = Math.random() < .8 ? 'diamond' : pick(ACCENTS).id;
  s.sides.style = pick(['none', 'pave', 'pave', 'channel', 'three']); s.sides.coverage = pick(COVERAGES).id; s.sides.sideShape = pick(SIDE_SHAPES).id; s.sides.sideSize = +lerp(.3, .5, Math.random()).toFixed(2); s.sides.accent = Math.random() < .85 ? 'diamond' : pick(ACCENTS).id;
  s.band.style = pick(BANDS).id; s.band.profile = s.sides.style === 'pave' || s.sides.style === 'channel' ? pick(['comfort', 'flat', 'dome']) : pick(BAND_PROFILES).id; s.band.width = +(s.sides.style === 'none' ? lerp(1.5, 3, Math.random()) : lerp(1.7, 2.6, Math.random())).toFixed(1);
  s.metal.id = pick(METALS).id; s.metal.head = Math.random() < .25 ? pick(HEAD_METALS).id : 'same'; s.metal.finish = Math.random() < .8 ? 'polish' : pick(FINISHES).id;
  s.details.milgrain = Math.random() < .2; s.details.hidden = Math.random() < .25 ? pick(HIDDEN_GEMS).id : 'none';
  s.fit.size = pick([5, 5.5, 6, 6.5, 7, 7.5]);
  state = s; update(); toast('Rolled a new ring. Nothing here is final.');
}

// ---------- update cycle ----------
function scheduleBuild() { if (!glReady || buildQueued) return; buildQueued = true; requestAnimationFrame(() => { buildQueued = false; try { setRing(state); } catch (e) { console.error(e); showStageMsg('Could not build this combination', e.message); } }); }
function update(o = {}) { clampState(); renderSlots(); if (!o.keepTray) renderTray(); updateSummary(); updateEstimate(); scheduleBuild(); save(); }
function showStageMsg(title, text) { const m = $('#stage-msg'); m.hidden = false; m.innerHTML = `<div><b>${esc(title)}</b>${esc(text)}</div>`; }

// ---------- theme ----------
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; try { t ? localStorage.setItem('halo.theme', t) : localStorage.removeItem('halo.theme'); } catch (e) { /* ignore */ } setStageColor(); }
function toggleTheme() { const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); setTheme(dark ? 'light' : 'dark'); }

// ---------- boot ----------
async function init() {
  try { const t = localStorage.getItem('halo.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  const saved = load(); if (saved) state = saved; clampState();
  renderLooks(); renderSlots(); renderTray(); updateSummary(); updateEstimate();
  $('#est-toggle').addEventListener('click', () => { estimatorOn = !estimatorOn; updateEstimate(); renderTray(); });
  $('#btn-spec').addEventListener('click', openDrawer); $('#drawer-close').addEventListener('click', closeDrawer); $('#scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  $('#btn-random').addEventListener('click', randomize);
  $('#btn-reset').addEventListener('click', () => { state = structuredClone(DEFAULT); update(); toast('Back to the starting ring.'); });
  $('#btn-theme').addEventListener('click', toggleTheme);
  $('#btn-copy-summary').addEventListener('click', () => { const s = summaryText(state); copyText(`${s.text} · ${s.mm}`, 'Summary copied'); });
  $('#views').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; for (const x of $('#views').children) x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); goView(b.dataset.view); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setStageColor);

  const stage = $('#stage'), canvas = $('#gl');
  try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'); }
  catch (e) { showStageMsg('3D preview could not load', 'The viewer needs the three.js library from cdn.jsdelivr.net. Check the connection and reload; the options and estimate still work.'); return; }
  try {
    initGL(canvas); bindControls(canvas); resizeGL(stage); new ResizeObserver(() => resizeGL(stage)).observe(stage);
    glReady = true; applyCamera(); setRing(state); requestAnimationFrame(frame);
    window.__halo = { R3, get state() { return state; }, estimate, stoneDims, THREE };
    setTimeout(() => { const h = $('#hint-rot'); if (h) h.style.opacity = '0'; }, 6000);
  } catch (e) { console.error(e); showStageMsg('3D preview unavailable', 'WebGL is not available in this browser. ' + e.message); }
}
init();
</script>
