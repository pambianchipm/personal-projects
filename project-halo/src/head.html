<title>Project Halo</title>
<meta name="description" content="Project Halo — a character-creator style engagement ring customizer with a live 3D ring and an optional price estimate, built to hand a spec to a jeweler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#ECEAE5; --panel:#F6F5F1; --panel2:#FFFFFF; --ink:#1C1A20; --ink2:#5E5B66; --muted:#8B8792;
    --line:#D8D4CC; --line2:#E7E4DD; --gold:#A8842F; --gold2:#C9A651; --gold-ink:#3E3110;
    --stage:#E3E0DA; --stage2:#CDC9C1; --good:#2F7D4F; --warn:#B4651C; --warn-bg:rgba(180,101,28,.10);
    --shadow:0 12px 32px rgba(20,18,26,.14); --sel-bg:rgba(168,132,47,.10); --focus:#2F5FD3;
    --display:'Fraunces',Georgia,'Times New Roman',serif;
    --ui:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141319; --panel:#1B1A21; --panel2:#23222A; --ink:#EEEBE4; --ink2:#B7B3BE; --muted:#807C89;
      --line:#2A2933; --line2:#33323D; --gold:#D6B35A; --gold2:#EAC974; --gold-ink:#F6E9C6;
      --stage:#1B1A21; --stage2:#0E0D12; --good:#7BC89A; --warn:#E0A05B; --warn-bg:rgba(224,160,91,.12);
      --shadow:0 12px 32px rgba(0,0,0,.5); --sel-bg:rgba(214,179,90,.13); --focus:#8FB0FF;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141319; --panel:#1B1A21; --panel2:#23222A; --ink:#EEEBE4; --ink2:#B7B3BE; --muted:#807C89;
    --line:#2A2933; --line2:#33323D; --gold:#D6B35A; --gold2:#EAC974; --gold-ink:#F6E9C6;
    --stage:#1B1A21; --stage2:#0E0D12; --good:#7BC89A; --warn:#E0A05B; --warn-bg:rgba(224,160,91,.12);
    --shadow:0 12px 32px rgba(0,0,0,.5); --sel-bg:rgba(214,179,90,.13); --focus:#8FB0FF;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  #app{height:100%;display:grid;grid-template-columns:292px 336px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);background:var(--bg)}

  /* ---------- header ---------- */
  #top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
  .brand h1 em{font-style:italic;color:var(--gold)}
  .brand .tag{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  #top .grow{flex:1}
  .btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:500;white-space:nowrap}
  .btn:hover{border-color:var(--gold2)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn.primary:hover{background:var(--gold2);border-color:var(--gold2)}
  .btn.ghost{background:transparent}
  .btn svg{width:16px;height:16px}

  /* ---------- slot rail ---------- */
  #slots{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  #slots .rail-head{padding:14px 16px 8px}
  .looks{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:thin}
  .look{flex:0 0 auto;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:500;color:var(--ink2)}
  .look:hover{border-color:var(--gold2);color:var(--ink)}
  .slot-list{flex:1;overflow-y:auto;min-height:0;border-top:1px solid var(--line)}
  .slot{display:grid;grid-template-columns:44px minmax(0,1fr) 16px;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line2);border-left:3px solid transparent;position:relative}
  .slot:hover{background:var(--sel-bg)}
  .slot[aria-current="true"]{border-left-color:var(--gold);background:var(--sel-bg)}
  .slot .ico{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
  .slot .ico svg{width:30px;height:30px}
  .slot .lab{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .slot .val{display:block;font-family:var(--display);font-size:16px;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .chev{color:var(--muted)}
  .slot .delta{position:absolute;right:30px;top:10px;font-size:11px;color:var(--muted)}
  .rail-foot{padding:10px 12px;display:flex;gap:8px;border-top:1px solid var(--line)}
  .rail-foot .btn{flex:1;justify-content:center;height:32px;font-size:13px}

  /* ---------- option tray ---------- */
  #tray{border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
  .tray-head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .tray-head h2{font-family:var(--display);font-size:22px}
  .tray-head p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:34ch}
  .tray-body{flex:1;overflow-y:auto;min-height:0;padding:14px 18px 24px;display:flex;flex-direction:column;gap:18px}
  .group{display:flex;flex-direction:column;gap:8px}
  .group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .group-head .eyebrow{color:var(--ink2)}
  .group-head .hint{font-size:12px;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);min-width:0;position:relative}
  .tile:hover{border-color:var(--gold2);color:var(--ink)}
  .tile[aria-pressed="true"]{border-color:var(--gold);background:var(--sel-bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
  .tile[disabled]{opacity:.4;cursor:not-allowed}
  .tile svg{width:38px;height:38px;flex:none}
  .tile .sw{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,.15);box-shadow:inset -6px -8px 14px rgba(0,0,0,.18),inset 6px 8px 12px rgba(255,255,255,.35)}
  .tile .t{font-size:12px;font-weight:500;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tile .d{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1}
  .tile .d.up{color:var(--warn)} .tile .d.down{color:var(--good)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:500;color:var(--ink2)}
  .chip:hover{border-color:var(--gold2);color:var(--ink)}
  .chip[aria-pressed="true"]{border-color:var(--gold);background:var(--sel-bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
  .range{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
  .range label{font-size:13px;color:var(--ink2)}
  .range .ro{font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .range input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold);margin:2px 0 0}
  .range .sub{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
  .field input[type=text]{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 10px;font:inherit}
  .switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
  .switchrow .l{font-size:13px;font-weight:500}
  .switchrow .s{font-size:12px;color:var(--muted)}
  .note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:12.5px;line-height:1.35}
  .note svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:1px}
  .note.ok{background:var(--sel-bg)} .note.ok svg{color:var(--gold)}

  /* switch */
  .switch{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--gold)}
  .switch[aria-checked="true"]::after{transform:translateX(16px)}

  /* ---------- stage ---------- */
  #stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 40%,var(--stage) 0%,var(--stage2) 100%)}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .stage-ui{position:absolute;inset:0;pointer-events:none}
  .stage-ui>*{pointer-events:auto}
  .views{position:absolute;left:16px;top:14px;display:flex;gap:6px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:4px}
  .views button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)}
  .views button[aria-pressed="true"]{background:var(--sel-bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
  .estimator{position:absolute;right:16px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:min(330px,calc(100% - 32px))}
  .est-toggle{display:flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 12px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);font-weight:500;font-size:13px}
  .est-card{width:330px;max-width:100%;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow);padding:14px 16px 12px}
  .est-card .eyebrow{display:flex;justify-content:space-between;align-items:center}
  .est-card .big{font-family:var(--display);font-size:30px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .est-card .big small{font-size:14px;color:var(--muted);font-family:var(--ui);margin-left:6px}
  .est-card .mid{font-size:12px;color:var(--muted);margin-bottom:10px}
  .lines{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
  .lines .k{color:var(--ink2)} .lines .k small{display:block;color:var(--muted);font-size:11px}
  .lines .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .lines .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:600}
  .est-card details{margin-top:10px;font-size:12px;color:var(--muted)}
  .est-card summary{cursor:pointer;color:var(--ink2)}
  .est-card details p{margin:6px 0 0;line-height:1.4}
  .est-card .link{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
  .strip{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .strip .summary{flex:1 1 260px;min-width:0;font-family:var(--display);font-size:15px;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strip .summary .num{font-size:12px;color:var(--muted);margin-left:8px}
  .strip .btn{height:36px}
  .stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink2);font-size:14px}
  .stage-msg b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:6px}
  .hint-rot{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

  /* ---------- drawer (spec / jeweler) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,9,14,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .drawer-head h2{font-family:var(--display);font-size:22px;flex:1}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px}
  .spec{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
  .spec .k{color:var(--muted)} .spec .v{color:var(--ink)}
  .spec .sec{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  textarea.json{width:100%;height:190px;font-family:var(--mono);font-size:11.5px;line-height:1.35;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px;resize:vertical}
  .jeweler{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
  .jeweler .av{width:44px;height:44px;border-radius:12px;background:var(--sel-bg);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--gold)}
  .jeweler .n{font-weight:600} .jeweler .m{font-size:12px;color:var(--muted)}
  .jeweler .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .jeweler .tags span{font-size:10.5px;padding:2px 6px;border-radius:999px;background:var(--sel-bg);color:var(--gold-ink)}
  .sample{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- responsive ---------- */
  @media (max-width:1100px){
    #app{grid-template-columns:250px 300px minmax(0,1fr)}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:820px){
    body{overflow:auto}
    #app{height:auto;min-height:100%;display:flex;flex-direction:column}
    #top{height:54px;padding:0 16px}
    #top .btn .lbl{display:none}
    #stage{order:1;height:46vh;min-height:300px;flex:none}
    #slots{order:2;border-right:0;border-top:1px solid var(--line)}
    #slots .rail-head,.rail-foot{display:none}
    .looks{display:none}
    .slot-list{display:flex;overflow-x:auto;overflow-y:hidden;border-top:0;scrollbar-width:thin}
    .slot{flex:0 0 auto;width:150px;grid-template-columns:36px minmax(0,1fr);border-bottom:0;border-left:0;border-right:1px solid var(--line2);border-top:3px solid transparent;padding:8px 10px}
    .slot[aria-current="true"]{border-top-color:var(--gold)}
    .slot .ico{width:36px;height:36px} .slot .ico svg{width:24px;height:24px}
    .slot .chev,.slot .delta{display:none}
    .slot .val{font-size:14px}
    #tray{order:3;border-right:0;border-top:1px solid var(--line);flex:1}
    .tray-body{padding:14px 16px 28px}
    .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
    .estimator{right:12px;top:10px}
    .est-card{width:280px}
    .views{left:12px;top:10px}
    .hint-rot{display:none}
    .strip{left:12px;right:12px;bottom:10px}
    .strip .summary{font-size:13px}
  }
  @media (prefers-reduced-motion: reduce){
    .drawer,.scrim,.toast,.switch,.switch::after{transition:none}
  }
</style>
